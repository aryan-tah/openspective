[project]
name = "openspective"
version = "0.1.0"
description = "Open-source, self-hosted drop-in replacement for Google's Perspective API. Same endpoints, same JSON, open models."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Aryan Tah", email = "aryan@vennbee.com" }]
requires-python = ">=3.11"
keywords = ["perspective-api", "toxicity", "content-moderation", "trust-and-safety", "detoxify", "self-hosted", "nlp"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Framework :: FastAPI",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Communications",
  "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Text Processing :: Linguistic",
]
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pydantic>=2.7",
  "py3langid>=0.3",
  "torch>=2.4",
  "transformers>=4.44",
  "sentencepiece>=0.2",
  "protobuf>=5",
]

[project.urls]
Homepage = "https://openspective.aryantah.com"
Documentation = "https://openspective.aryantah.com"
Repository = "https://github.com/aryan-tah/openspective"
Issues = "https://github.com/aryan-tah/openspective/issues"
Changelog = "https://github.com/aryan-tah/openspective/blob/main/CHANGELOG.md"

[project.scripts]
openspective = "openspective.cli:main"

[dependency-groups]
dev = [
  "pytest>=8",
  "httpx>=0.27",
  "ruff>=0.6",
  "mypy>=1.11",
  "google-api-python-client>=2.140",
]

[build-system]
requires = ["uv_build>=0.11.19,<0.14.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "S", "PT"]
# RUF001: multilingual text and punctuation are intentional here.
ignore = ["S101", "RUF001"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["models: downloads and runs the real models (slow)"]
addopts = "-m 'not models'"

# uv users get CPU-only torch on Linux and Windows (no multi-GB CUDA wheels). pip users get PyPI's torch.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform != 'darwin'" }]
