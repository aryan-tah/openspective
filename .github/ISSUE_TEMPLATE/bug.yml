name: Bug
description: openspective crashed, returned an error, or broke a client that worked with Perspective.
labels: ["type: bug", "status: needs triage"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you sent, what you expected, and what you got instead.
    validations:
      required: true
  - type: textarea
    id: request
    attributes:
      label: Request and response
      description: The JSON you sent and the JSON or error you got back. Remove API keys.
      render: json
  - type: input
    id: version
    attributes:
      label: openspective version
      placeholder: "0.1.0"
    validations:
      required: true
  - type: dropdown
    id: how
    attributes:
      label: How you run it
      options: [Docker, pip / uv, From source, Other]
  - type: input
    id: client
    attributes:
      label: Client
      description: The app or library calling openspective, if it isn't your own code.
      placeholder: "Coral Talk, Discourse, googleapiclient, lm-eval-harness…"
