name: Feature or integration
description: Suggest a capability, an attribute, a language, or a client integration.
labels: ["type: feature", "status: needs triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What can't you do today? Which Perspective feature or client do you depend on?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you'd like
  - type: textarea
    id: alternatives
    attributes:
      label: What you do today instead
